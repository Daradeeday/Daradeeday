<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Day Dechdecho - fullstack developer and maker from Nakhonratchasima, Thailand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Day Dechdecho</title>
  <style>
    .name { font: 700 46px "Trebuchet MS","Leelawadee UI",Tahoma,sans-serif; fill: #EAF2FF; letter-spacing: -0.5px; }
    .sub  { font: 400 19px "Leelawadee UI",Tahoma,"Segoe UI",sans-serif; fill: #9DB8E6; }
    .loc  { font: 400 15px Consolas,Menlo,"Courier New",monospace; fill: #E8A04C; }
    .chip { font: 700 22px Consolas,Menlo,"Courier New",monospace; fill: #EAF2FF; letter-spacing: 3px; }
    .chip2{ font: 400 10px Consolas,Menlo,"Courier New",monospace; fill: #9DB8E6; }
    .trace{ fill: none; stroke: #E8A04C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.6,0,.2,1) forwards; }
    .t2 { animation-delay: .25s } .t3 { animation-delay: .5s } .t4 { animation-delay: .75s }
    .t5 { animation-delay: .35s } .t6 { animation-delay: .6s } .t7 { animation-delay: .9s }
    .pad  { fill: #0D2B5E; stroke: #E8A04C; stroke-width: 2.5; opacity: 0; animation: pop .3s 2s forwards; }
    .chipbox { opacity: 0; animation: pop .5s .1s forwards; }
    .led  { fill: #7FE0D0; opacity: 0; animation: pop .2s 2s forwards, blink 1.8s 2.3s infinite; }
    .glow { fill: #7FE0D0; opacity: 0; animation: glow 1.8s 2.3s infinite; }
    .cur  { fill: #E8A04C; animation: cur 1s steps(1) infinite; }
    @keyframes draw  { to { stroke-dashoffset: 0 } }
    @keyframes pop   { to { opacity: 1 } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes glow  { 0%,100% { opacity: .35 } 50% { opacity: 0 } }
    @keyframes cur   { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0 }
      .pad, .chipbox, .led { animation: none; opacity: 1 }
      .glow { animation: none; opacity: .3 }
      .cur { animation: none }
    }
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#EAF2FF" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#EAF2FF" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="280" rx="12" fill="#0D2B5E"/>
  <rect width="900" height="280" rx="12" fill="url(#g)"/>
  <rect width="900" height="280" rx="12" fill="url(#G)"/>

  <!-- text -->
  <text class="name" x="44" y="118">Day Dechdecho</text>
  <text class="sub" x="46" y="156">เขียนเว็บ ต่อวงจร ปั้นโมเดล</text>
  <text class="loc" x="46" y="206">Nakhonratchasima, TH</text>
  <rect class="cur" x="226" y="193" width="9" height="16"/>

  <!-- left traces -->
  <path class="trace t5" pathLength="1" d="M620 110H590L570 90V30"/>
  <path class="trace t6" pathLength="1" d="M620 130H585L565 150V225"/>
  <path class="trace t7" pathLength="1" d="M620 150H600V262"/>
  <!-- right traces -->
  <path class="trace" pathLength="1" d="M760 110H800L820 90H850"/>
  <path class="trace t2" pathLength="1" d="M760 130H830L850 150H878"/>
  <path class="trace t3" pathLength="1" d="M760 150H790L810 170V232"/>
  <path class="trace t4" pathLength="1" d="M760 170H780V262"/>

  <!-- chip -->
  <g class="chipbox">
    <g fill="#9DB8E6">
      <rect x="610" y="107" width="10" height="6"/><rect x="610" y="127" width="10" height="6"/><rect x="610" y="147" width="10" height="6"/>
      <rect x="760" y="107" width="10" height="6"/><rect x="760" y="127" width="10" height="6"/><rect x="760" y="147" width="10" height="6"/><rect x="760" y="167" width="10" height="6"/>
    </g>
    <rect x="620" y="94" width="140" height="96" rx="6" fill="#12356F" stroke="#EAF2FF" stroke-width="1.5"/>
    <circle cx="634" cy="108" r="3" fill="none" stroke="#9DB8E6" stroke-width="1.2"/>
    <text class="chip" x="690" y="146" text-anchor="middle">DAY</text>
    <text class="chip2" x="690" y="168" text-anchor="middle">korat / th</text>
  </g>

  <!-- pads -->
  <circle class="pad" cx="570" cy="30" r="6"/>
  <circle class="pad" cx="565" cy="225" r="6"/>
  <circle class="pad" cx="810" cy="232" r="6"/>
  <circle class="pad" cx="878" cy="150" r="6"/>

  <!-- led at end of first right trace -->
  <circle class="glow" cx="858" cy="90" r="15"/>
  <circle class="led" cx="858" cy="90" r="6"/>
</svg>
